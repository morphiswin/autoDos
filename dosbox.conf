[sdl]
# Tuned for a 19" 4:3 LCD running at 1600x1200, 60 Hz.
# Start fullscreen at the desktop resolution. Keep Windows at the panel's
# native resolution so the monitor never has to rescale the picture.
fullscreen = true
fullresolution = desktop
# Alt+Enter window: exact 4x of 320x240, fits on a 1600x1200 desktop.
windowresolution = 1280x960
# Nearest-neighbour scaling. 320x200 games scale by exactly 5x6 at
# 1600x1200, so every DOS pixel stays a crisp, even block on the LCD
# instead of being smeared by bilinear filtering.
output = texturenb
texture_renderer = direct3d
# 60 Hz panel vs 70 Hz VGA games: leave vsync on auto. Forcing it on makes
# DOSBox drop frames and can slow emulation down on a 60 Hz display.
vsync = auto
presentation_mode = auto
# Give DOSBox more CPU time while it's in front.
priority = higher normal

[dosbox]
machine = svga_s3
memsize = 64
# Skip the welcome banner so games go straight to the picture.
startup_verbosity = low

[cpu]
core = auto
cputype = auto
cpu_cycles = max
cpu_cycles_protected = max

[mixer]
nosound = false
rate = 44100

[midi]
mpu401 = intelligent
mididevice = auto

[sblaster]
sbtype = sb16
sbbase = 220
irq = 7
dma = 1
hdma = 5
sbmixer = true
oplmode = auto

[render]
# 4:3 correction for 320x200/640x400 games. On a 1600x1200 screen 320x200
# scales by exactly 5x6 and fills the whole screen with no black borders.
aspect = on
# Fill the screen instead of snapping to whole-number multiples (which would
# leave black borders on 640x480 games).
integer_scaling = off
viewport = fit

[speaker]
pcspeaker = impulse

[joystick]
joysticktype = auto

[serial]
serial1 = dummy
serial2 = dummy
serial3 = disabled
serial4 = disabled

[dos]
xms = true
ems = true
umb = true
keyboardlayout = auto

[autoexec]
