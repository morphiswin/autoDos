[sdl]
# Tuned for a 19" 4:3 CRT running a 1600x1200 desktop.
# Start fullscreen at the desktop resolution: no mode switch, so the CRT keeps
# its current refresh rate and doesn't blank/resync on every launch.
fullscreen = true
fullresolution = desktop
# Alt+Enter window: exact 4x of 320x240, fits on a 1600x1200 desktop.
windowresolution = 1280x960
output = texture
texture_renderer = direct3d
vsync = auto
presentation_mode = auto
# Give DOSBox more CPU time while it's in front.
priority = higher normal

[dosbox]
machine = svga_s3
memsize = 64
# Skip the welcome banner so games go straight to the picture.
startup_verbosity = low

[cpu]
core = auto
cputype = auto
cpu_cycles = max
cpu_cycles_protected = max

[mixer]
nosound = false
rate = 44100

[midi]
mpu401 = intelligent
mididevice = auto

[sblaster]
sbtype = sb16
sbbase = 220
irq = 7
dma = 1
hdma = 5
sbmixer = true
oplmode = auto

[render]
# 4:3 correction for 320x200/640x400 games. On a 1600x1200 screen 320x200
# scales by exactly 5x6 and fills the whole tube with no black borders.
aspect = on
# Fill the screen instead of snapping to whole-number multiples (which would
# leave black borders on 640x480 games).
integer_scaling = off
viewport = fit

[speaker]
pcspeaker = impulse

[joystick]
joysticktype = auto

[serial]
serial1 = dummy
serial2 = dummy
serial3 = disabled
serial4 = disabled

[dos]
xms = true
ems = true
umb = true
keyboardlayout = auto

[autoexec]
